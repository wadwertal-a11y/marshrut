<style>
  :root{
    --paper:#F2F6FA;
    --card:#FFFFFF;
    --ink:#1C2B3A;
    --ink-soft:#5E7185;
    --border:#DCE6F0;
    --teal:#3373A0;
    --teal-dark:#1F4E70;
    --gold:#B8892F;
    --sage:#4B7857;
    --slate:#8B96A5;
    --danger:#B1503F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:640px; margin:0 auto; padding:20px 16px 100px; }
  h1,h2,h3{ font-family:'Fraunces',serif; margin:0; }
  .top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .top h1{ font-size:26px; font-weight:600; letter-spacing:-0.01em; }
  .top .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .new-trip-btn{
    background:linear-gradient(135deg,#3373A0,#1F4E70); color:#fff; border:none; border-radius:10px;
    padding:10px 14px; font-size:13.5px; font-weight:500; cursor:pointer;
    font-family:'Inter',sans-serif; white-space:nowrap;
  }
  .new-trip-btn:active{transform:scale(0.97);}
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty h3{font-size:19px;color:var(--ink);margin-bottom:8px;font-weight:600;}
  .empty p{font-size:14px;line-height:1.5;margin:0 0 18px;}
  .trip-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:16px; overflow:hidden; }
  .trip-head{ padding:16px 18px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .trip-head-left{min-width:0;}
  .trip-name{font-size:18px;font-weight:600;}
  .trip-dest{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .trip-meta{font-size:11.5px;color:var(--ink-soft);margin-top:6px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.01em;}
  .chevron{flex-shrink:0;transition:transform 0.2s ease;color:var(--ink-soft);}
  .chevron.open{transform:rotate(180deg);}
  .bookings{border-top:1px solid var(--border);padding:14px 14px 16px;display:none;}
  .bookings.open{display:block;}

  .card{
    background:var(--paper); border:1px solid var(--border); border-radius:10px;
    margin-bottom:10px; overflow:hidden;
  }
  .card-head{ display:flex; align-items:flex-start; gap:10px; padding:11px 12px; cursor:pointer; }
  .card-icon{ width:30px;height:30px;flex-shrink:0;border-radius:8px;background:#E6EFF7;color:var(--teal); display:flex;align-items:center;justify-content:center; }
  .card-icon svg{width:16px;height:16px;}
  .card-main{ flex:1; min-width:0; }
  .card-title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-title{ font-size:14.5px; font-weight:600; line-height:1.3; }
  .status-pill{ font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; white-space:nowrap; letter-spacing:0.01em; flex-shrink:0; }
  .status-upcoming{background:#F3E7CB;color:var(--gold);}
  .status-active{background:#DCEADD;color:var(--sage);}
  .status-done{background:#E9EAEC;color:var(--slate);}
  .card-route{ font-size:12.5px; color:var(--ink); margin-top:3px; font-family:'IBM Plex Mono',monospace; }
  .card-time{ font-size:12px; color:var(--ink-soft); margin-top:3px; font-family:'IBM Plex Mono',monospace; }
  .card-duration{ display:inline-block; font-size:10.5px; color:var(--teal-dark); background:#E6EFF7; padding:1px 6px; border-radius:6px; margin-left:6px; font-family:'Inter',sans-serif; }
  .card-code{ font-size:11px; color:var(--ink-soft); margin-top:3px; font-family:'IBM Plex Mono',monospace; }
  .card-chevron{ width:14px;height:14px;color:var(--ink-soft);flex-shrink:0;margin-top:3px;transition:transform .2s ease; }
  .card-chevron.open{transform:rotate(180deg);}

  .card-detail{ display:none; border-top:1px dashed var(--border); padding:10px 12px 12px 12px; }
  .card-detail.open{display:block;}
  .detail-row{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; line-height:1.4; }
  .detail-row b{color:var(--ink);font-weight:600;}
  .detail-row a{color:var(--teal);word-break:break-all;}
  .detail-actions{ display:flex; gap:8px; margin-top:8px; }
  .mini-btn{
    flex:1; padding:8px; border-radius:8px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif; border:1px solid var(--border);
    background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .mini-btn.danger{color:var(--danger);}
  .mini-btn svg{width:13px;height:13px;}

  .add-booking-btn{
    width:100%; background:none; border:1px dashed var(--border); border-radius:10px;
    padding:10px; color:var(--teal); font-size:13px; font-weight:500; cursor:pointer;
    margin-top:2px; font-family:'Inter',sans-serif;
  }
  .add-ticket-btn{
    width:100%; background:linear-gradient(135deg,#3373A0,#1F4E70); border:none; border-radius:10px; padding:10px;
    color:#fff; font-size:13px; font-weight:600; cursor:pointer; margin-top:8px;
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .pro-badge{ font-size:9.5px; font-weight:700; background:rgba(255,255,255,0.25); padding:2px 6px; border-radius:6px; letter-spacing:0.03em; }
  .parse-hint{ font-size:11px; color:var(--ink-soft); text-align:center; margin-top:6px; line-height:1.4; }
  .del-trip{ font-size:11.5px; color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:6px 0 0; font-family:'Inter',sans-serif; }
  .del-trip:hover{color:var(--danger);}

  .overlay{ position:fixed;inset:0; background:rgba(33,38,46,0.45); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.open{display:flex;}
  .sheet{ background:var(--card); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:20px 18px 24px; max-height:88vh; overflow-y:auto; }
  .sheet h3{font-size:17px;font-weight:600;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:9px;
    font-size:14.5px; font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
  }
  .field textarea{resize:none;min-height:50px;}
  .type-row{display:flex;gap:6px;flex-wrap:wrap;}
  .type-opt{
    flex:1; min-width:70px; padding:9px 4px; border:1px solid var(--border); border-radius:9px;
    text-align:center; font-size:12px; cursor:pointer; color:var(--ink-soft);
  }
  .type-opt.sel{ border-color:var(--teal); background:#E6EFF7; color:var(--teal-dark); font-weight:600; }
  .sheet-actions{display:flex;gap:10px;margin-top:16px;}
  .btn{ flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-primary{background:linear-gradient(135deg,#3373A0,#1F4E70);color:#fff;}
  .btn-ghost{background:none;color:var(--ink-soft);border:1px solid var(--border);}

  .airport-wrap{position:relative;}
  .airport-results{
    position:absolute; left:0; right:0; top:100%; background:var(--card);
    border:1px solid var(--border); border-radius:9px; margin-top:4px; max-height:180px;
    overflow-y:auto; z-index:10; box-shadow:0 6px 18px rgba(0,0,0,0.08);
  }
  .airport-opt{ padding:8px 11px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border); }
  .airport-opt:last-child{border-bottom:none;}
  .airport-opt:hover{background:var(--paper);}
  .airport-opt .code{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--teal-dark);}
  .airport-opt .city{color:var(--ink-soft);font-size:11.5px;}
</style>
</head>
<body>
<div id="storageNote" style="display:none;max-width:640px;margin:10px auto 0;padding:8px 14px;font-size:12px;color:#8A6A2E;background:#F7EEDA;border-radius:8px;text-align:center;font-family:'Inter',sans-serif;">Изменения видны в этой сессии, но пока не сохраняются между визитами</div>
<div class="app" id="app"></div>

<div class="overlay" id="tripOverlay">
  <div class="sheet">
    <h3>Новая поездка</h3>
    <div class="field"><label>Название</label><input id="tripNameInput" placeholder="Например: Грузия, октябрь"></div>
    <div class="field"><label>Направление</label><input id="tripDestInput" placeholder="Тбилиси, Батуми"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeTripSheet()">Отмена</button>
      <button class="btn btn-primary" onclick="saveTrip()">Создать</button>
    </div>
  </div>
</div>

<div class="overlay" id="bookingOverlay">
  <div class="sheet" id="bookingSheetInner">
    <h3 id="bookingSheetTitle">Добавить бронирование</h3>
    <div class="field">
      <label>Тип</label>
      <div class="type-row" id="typeRow"></div>
    </div>
    <div class="field" id="subtypeField" style="display:none;">
      <label>Вид транспорта</label>
      <div class="type-row" id="subtypeRow"></div>
    </div>

    <div id="dynamicFields"></div>

    <div class="field"><label>Источник (где куплено)</label><input id="bSource" placeholder="Booking.com, сайт авиакомпании..."></div>
    <div class="field"><label>Начало</label><input id="bStart" type="datetime-local"></div>
    <div class="field"><label>Окончание (если есть)</label><input id="bEnd" type="datetime-local"></div>
    <div class="field"><label>Номер брони / код</label><input id="bCode" placeholder="PNR, номер подтверждения"></div>
    <div class="field"><label>Ссылка</label><input id="bLink" placeholder="Ссылка на бронь/билет"></div>
    <div class="field"><label>Заметка</label><textarea id="bNotes" placeholder="Что важно не забыть"></textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeBookingSheet()">Отмена</button>
      <button class="btn btn-primary" onclick="saveBooking()">Сохранить</button>
    </div>
  </div>
</div>

let AIRPORTS = FALLBACK_AIRPORTS;

async function loadAirports(){
  let base = FALLBACK_AIRPORTS;
  try{
    const cached = localStorage.getItem('airports_cache_v1');
    if(cached){
      base = JSON.parse(cached);
    } else {
      const res = await fetch('https://raw.githubusercontent.com/mwgg/Airports/master/airports.json');
      const data = await res.json();
      const slim = Object.values(data)
        .filter(a => a.iata && a.iata.length === 3)
        .map(a => ({iata:a.iata, city:a.city||'', name:a.name||'', country:a.country||'', tz:a.tz||''}));
      if(slim.length){
        base = slim;
        try{ localStorage.setItem('airports_cache_v1', JSON.stringify(slim)); }catch(e){ /* quota — skip caching, still usable this session */ }
      }
    }
  }catch(e){ /* offline or blocked — keep curated ~100-airport fallback */ }
  let customs = [];
  try{ customs = JSON.parse(localStorage.getItem('custom_airports_v1')||'[]'); }catch(e){}
  AIRPORTS = base.concat(customs);
}

function searchAirports(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return [];
  return AIRPORTS.filter(a =>
    a.iata.toLowerCase().startsWith(q) ||
    (a.city && a.city.toLowerCase().includes(q)) ||
    (a.name && a.name.toLowerCase().includes(q))
  ).slice(0,8);
}

function fmtDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateTime(iso){
  if(!iso) return '';
  return fmtDateShort(iso) + ', ' + fmtTime(iso);
}

function bookingStatus(b){
  const now = new Date();
  const start = b.start ? new Date(b.start) : null;
  const end = b.end ? new Date(b.end) : start;
  if(!start) return {key:'upcoming', label:'Без даты'};
  if(now < start) return {key:'upcoming', label:'Предстоит'};
  if(end && now > end) return {key:'done', label:'Завершено'};
  return {key:'active', label:'Сейчас'};
}

function flightDuration(b){
  if(!(b.start && b.end && b.fromAirport && b.fromAirport.tz && b.toAirport && b.toAirport.tz)) return null;
  try{
    const DateTime = luxon.DateTime;
    const dep = DateTime.fromISO(b.start, {zone: b.fromAirport.tz});
    const arr = DateTime.fromISO(b.end, {zone: b.toAirport.tz});
    const mins = arr.diff(dep, 'minutes').minutes;
    if(!isFinite(mins) || mins < 0) return null;
    return `${Math.floor(mins/60)}ч ${Math.round(mins%60)}м`;
  }catch(e){ return null; }
}
function simpleDuration(b){
  if(!b.start || !b.end) return null;
  const ms = new Date(b.end) - new Date(b.start);
  if(ms <= 0) return null;
  const mins = Math.round(ms/60000);
  return `${Math.floor(mins/60)}ч ${mins%60}м`;
}
function nightsCount(b){
  if(!b.start || !b.end) return null;
  const d1 = new Date(b.start.slice(0,10));
  const d2 = new Date(b.end.slice(0,10));
  const diff = Math.round((d2-d1)/86400000);
  return diff > 0 ? diff : null;
}

function bookingIcon(b){
  if(b.type === 'transport') return ICONS[b.subtype] || ICONS.plane;
  return ICONS[b.type];
}
function bookingTitle(b){
  if(b.type === 'stay') return b.hotelName || 'Проживание';
  if(b.type === 'transport') return b.title || SUBTYPE_LABELS[b.subtype] || 'Транспорт';
  return b.title || TYPE_LABELS[b.type];
}
function bookingRoute(b){
  if(b.type === 'transport'){
    const from = b.fromAirport ? b.fromAirport.iata : (b.fromCity || '');
    const to = b.toAirport ? b.toAirport.iata : (b.toCity || '');
    if(from || to) return `${from || '—'} → ${to || '—'}`;
    return '';
  }
  if(b.type === 'stay') return b.hotelCity || '';
  return b.excCity || '';
}
function bookingDurationBadge(b){
  if(b.type === 'transport'){
    const d = b.subtype === 'plane' ? flightDuration(b) : simpleDuration(b);
    return d ? `<span class="card-duration">${d}</span>` : '';
  }
  if(b.type === 'stay'){
    const n = nightsCount(b);
    return n ? `<span class="card-duration">${n} ноч.</span>` : '';
  }
  return '';
}

function tripRange(trip){
  if(!trip.bookings.length) return 'Пока нет бронирований';
  const dates = trip.bookings.map(b=>b.start).filter(Boolean).map(d=>new Date(d));
  if(!dates.length) return trip.bookings.length + ' поз.';
  const min = new Date(Math.min(...dates));
  const max = new Date(Math.max(...dates));
  return fmtDateShort(min) + ' — ' + fmtDateShort(max) + ' · ' + trip.bookings.length + ' поз.';
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML=''; return; }

  let html = `
    <div class="top">
      <div>
        <h1>Маршрут</h1>
        <div class="sub">Все брони — в одном месте</div>
      </div>
      <button class="new-trip-btn" onclick="openTripSheet()">+ Поездка</button>
    </div>
  `;

  if(trips.length === 0){
    html += `
      <div class="empty">
        <h3>Пока пусто</h3>
        <p>Создайте поездку и добавляйте в неё билеты, отели и экскурсии — с любых сайтов, где вы их покупали.</p>
        <button class="new-trip-btn" onclick="openTripSheet()">Создать первую поездку</button>
      </div>
    `;
  } else {
    trips.sort((a,b)=>{
      const da = a.bookings.map(x=>x.start).filter(Boolean).sort()[0] || '9999';
      const db = b.bookings.map(x=>x.start).filter(Boolean).sort()[0] || '9999';
      return da < db ? -1 : 1;
    });

    trips.forEach(trip=>{
      const isOpen = openTripId === trip.id;
      html += `<div class="trip-card">
        <div class="trip-head" onclick="toggleTrip('${trip.id}')">
          <div class="trip-head-left">
            <div class="trip-name">${esc(trip.name)}</div>
            ${trip.dest ? `<div class="trip-dest">${esc(trip.dest)}</div>` : ''}
            <div class="trip-meta">${tripRange(trip)}</div>
          </div>
          <svg class="chevron ${isOpen?'open':''}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="bookings ${isOpen?'open':''}">
      `;

      const sorted = [...trip.bookings].sort((a,b)=> (a.start||'') < (b.start||'') ? -1 : 1);
      sorted.forEach(b=>{
        const st = bookingStatus(b);
        const key = trip.id + ':' + b.id;
        const detailOpen = openBookingKey === key;
        html += `
          <div class="card">
            <div class="card-head" onclick="toggleBooking('${key}')">
              <div class="card-icon">${bookingIcon(b)}</div>
              <div class="card-main">
                <div class="card-title-row">
                  <div class="card-title">${esc(bookingTitle(b))}</div>
                  <span class="status-pill status-${st.key}">${st.label}</span>
                </div>
                ${bookingRoute(b) ? `<div class="card-route">${esc(bookingRoute(b))}</div>` : ''}
                <div class="card-time">${b.start ? fmtDateTime(b.start) : ''}${b.end ? ' → ' + fmtDateTime(b.end) : ''}${bookingDurationBadge(b)}</div>
                ${b.code ? `<div class="card-code">№ ${esc(b.code)}</div>` : ''}
              </div>
            </div>
            <div class="card-detail ${detailOpen?'open':''}">
              ${b.source ? `<div class="detail-row"><b>Источник:</b> ${esc(b.source)}</div>` : ''}
              ${b.link ? `<div class="detail-row"><b>Ссылка:</b> <a href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.link)}</a></div>` : ''}
              ${b.notes ? `<div class="detail-row"><b>Заметка:</b> ${esc(b.notes)}</div>` : ''}
              <div class="detail-actions">
                <button class="mini-btn" onclick="event.stopPropagation(); openBookingSheet('${trip.id}','${b.id}')">${ICONS.edit} Изменить</button>
                <button class="mini-btn danger" onclick="event.stopPropagation(); deleteBooking('${trip.id}','${b.id}')">${ICONS.trash} Удалить</button>
              </div>
            </div>
          </div>
        `;
      });

      html += `
          <button class="add-booking-btn" onclick="openBookingSheet('${trip.id}')">+ Добавить бронирование вручную</button>
          <button class="add-ticket-btn" onclick="triggerTicketUpload('${trip.id}')">📎 Прислать билет / PDF <span class="pro-badge">PRO</span></button>
          <input type="file" id="ticketFile" accept="image/*,.pdf" style="display:none" onchange="handleTicketFile(event)">
          <div class="parse-hint">Разбор фото и PDF — демо-версия интерфейса. В боевой версии данные распознаёт ИИ на сервере.</div>
          <button class="del-trip" onclick="deleteTrip('${trip.id}')">Удалить поездку</button>
        </div>
      </div>`;
    });
  }

  app.innerHTML = html;
}

function renderAirportResults(which, q){
  const box = document.getElementById(which==='from'?'fromResults':'toResults');
  const matches = searchAirports(q);
  if(!matches.length){ box.innerHTML=''; box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML = matches.map(a=>
    `<div class="airport-opt" onclick="pickAirport('${which}','${a.iata}')"><span class="code">${a.iata}</span> — ${esc(a.city)} <span class="city">(${esc(a.name)}, ${esc(a.country)})</span></div>`
  ).join('');
}
function pickAirport(which, iata){
  const a = AIRPORTS.find(x=>x.iata===iata);
  if(!a) return;
  if(which==='from'){
    fromAirportObj = a;
    document.getElementById('bFromAirport').value = `${a.iata} — ${a.city}`;
    document.getElementById('fromResults').style.display='none';
  } else {
    toAirportObj = a;
    document.getElementById('bToAirport').value = `${a.iata} — ${a.city}`;
    document.getElementById('toResults').style.display='none';
  }
}
function toggleCustomAirport(which){
  const form = document.getElementById(which+'CustomForm');
  if(!form) return;
  form.style.display = form.style.display==='none' ? 'block' : 'none';
}
function addCustomAirport(which){
  const cityInput = document.getElementById(which+'CustomCity');
  const codeInput = document.getElementById(which+'CustomCode');
  const city = cityInput.value.trim();
  if(!city) return;
  let code = codeInput.value.trim().toUpperCase();
  if(!code) code = city.replace(/[^A-Za-zА-Яа-я]/g,'').slice(0,3).toUpperCase() || 'XXX';
  // tz is intentionally left unknown — this airport won't be used for
  // timezone-aware flight-duration math until someone confirms its tz
  const airport = {iata: code, city, name: city, country:'', tz:null, custom:true};
  let customs = [];
  try{ customs = JSON.parse(localStorage.getItem('custom_airports_v1')||'[]'); }catch(e){}
  customs.push(airport);
  try{ localStorage.setItem('custom_airports_v1', JSON.stringify(customs)); }catch(e){}
  AIRPORTS.push(airport);
  if(which==='from'){
    fromAirportObj = airport;
    document.getElementById('bFromAirport').value = `${airport.iata} — ${airport.city}`;
  } else {
    toAirportObj = airport;
    document.getElementById('bToAirport').value = `${airport.iata} — ${airport.city}`;
  }
  document.getElementById(which+'CustomForm').style.display='none';
  cityInput.value=''; codeInput.value='';
}

function openBookingSheet(tripId, bookingId){
  editingTripFor = tripId;
  editingBookingId = bookingId || null;
  fromAirportObj = null;
  toAirportObj = null;

  const trip = trips.find(t=>t.id===tripId);
  const existing = bookingId ? trip.bookings.find(b=>b.id===bookingId) : null;

  selectedType = existing ? existing.type : 'transport';
  selectedSubtype = existing && existing.subtype ? existing.subtype : 'plane';
  if(existing && existing.fromAirport) fromAirportObj = existing.fromAirport;
  if(existing && existing.toAirport) toAirportObj = existing.toAirport;

  document.getElementById('bookingSheetTitle').textContent = existing ? 'Изменить бронирование' : 'Добавить бронирование';
  renderTypeRow();

  // prefill after dynamic fields exist
  setTimeout(()=>{
    if(existing){
      if(document.getElementById('bTitle')) document.getElementById('bTitle').value = existing.title || '';
      if(document.getElementById('bFromCity')) document.getElementById('bFromCity').value = existing.fromCity || '';
      if(document.getElementById('bToCity')) document.getElementById('bToCity').value = existing.toCity || '';
      if(document.getElementById('bHotelCity')) document.getElementById('bHotelCity').value = existing.hotelCity || '';
      if(document.getElementById('bHotelName')) document.getElementById('bHotelName').value = existing.hotelName || '';
      if(document.getElementById('bExcCity')) document.getElementById('bExcCity').value = existing.excCity || '';
    }
    document.getElementById('bSource').value = existing ? (existing.source||'') : '';
    document.getElementById('bStart').value = existing ? (existing.start||'') : '';
    document.getElementById('bEnd').value = existing ? (existing.end||'') : '';
    document.getElementById('bCode').value = existing ? (existing.code||'') : '';
    document.getElementById('bLink').value = existing ? (existing.link||'') : '';
    document.getElementById('bNotes').value = existing ? (existing.notes||'') : '';
  }, 0);

  if(!existing){
    document.getElementById('bSource').value = '';
    document.getElementById('bStart').value = '';
    document.getElementById('bEnd').value = '';
    document.getElementById('bCode').value = '';
    document.getElementById('bLink').value = '';
    document.getElementById('bNotes').value = '';
  }

  document.getElementById('bookingOverlay').classList.add('open');
}
function closeBookingSheet(){ document.getElementById('bookingOverlay').classList.remove('open'); }

async function saveBooking(){
  if(!editingTripFor) return;
  const trip = trips.find(t=>t.id===editingTripFor);
  if(!trip) return;

  const data = {
    type: selectedType,
    subtype: selectedType === 'transport' ? selectedSubtype : undefined,
    title: document.getElementById('bTitle') ? document.getElementById('bTitle').value.trim() : '',
    fromCity: document.getElementById('bFromCity') ? document.getElementById('bFromCity').value.trim() : '',
    toCity: document.getElementById('bToCity') ? document.getElementById('bToCity').value.trim() : '',
    fromAirport: (selectedType==='transport' && selectedSubtype==='plane') ? fromAirportObj : null,
    toAirport: (selectedType==='transport' && selectedSubtype==='plane') ? toAirportObj : null,
    hotelCity: document.getElementById('bHotelCity') ? document.getElementById('bHotelCity').value.trim() : '',
    hotelName: document.getElementById('bHotelName') ? document.getElementById('bHotelName').value.trim() : '',
    excCity: document.getElementById('bExcCity') ? document.getElementById('bExcCity').value.trim() : '',
    source: document.getElementById('bSource').value.trim(),
    start: document.getElementById('bStart').value,
    end: document.getElementById('bEnd').value,
    code: document.getElementById('bCode').value.trim(),
    link: document.getElementById('bLink').value.trim(),
    notes: document.getElementById('bNotes').value.trim()
  };

  if(editingBookingId){
    const idx = trip.bookings.findIndex(b=>b.id===editingBookingId);
    if(idx > -1) trip.bookings[idx] = {...trip.bookings[idx], ...data};
  } else {
    trip.bookings.push({id:'b'+Date.now(), ...data});
  }

  closeBookingSheet();
  render();
  await persist();
}

async function deleteBooking(tripId, bookingId){
  const trip = trips.find(t=>t.id===tripId);
  if(!trip) return;
  trip.bookings = trip.bookings.filter(b=>b.id!==bookingId);
  if(openBookingKey === tripId+':'+bookingId) openBookingKey = null;
  render();
  await persist();
}

function triggerTicketUpload(tripId){
  editingTripFor = tripId;
  editingBookingId = null;
  document.getElementById('ticketFile').click();
}
async function handleTicketFile(e){
  const file = e.target.files[0];
  if(!file || !editingTripFor) return;
  const trip = trips.find(t=>t.id===editingTripFor);
  if(!trip) return;
  trip.bookings.push({
    id: 'b'+Date.now(),
    type: 'transport',
    subtype: 'plane',
    title: file.name.replace(/\.[^.]+$/, ''),
    source: 'Распознано из файла (демо)',
    start: '', end: '', code: '', link: '',
    notes: 'Загружено: ' + file.name + ' — в демо-версии данные не извлекаются автоматически'
  });
  e.target.value = '';
  render();
  await persist();
}

function initTelegram(){
  try{
    const tg = window.Telegram && window.Telegram.WebApp;
    if(!tg) return;
    tg.ready();
    tg.expand();
    const root = document.documentElement.style;
    const p = tg.themeParams || {};
    if(p.bg_color) root.setProperty('--paper', p.bg_color);
    if(p.text_color) root.setProperty('--ink', p.text_color);
    if(p.hint_color) root.setProperty('--ink-soft', p.hint_color);
    if(p.button_color) root.setProperty('--teal', p.button_color);
    if(p.secondary_bg_color) root.setProperty('--card', p.secondary_bg_color);
  }catch(e){ /* not running inside Telegram — keep default theme */ }
}
initTelegram();
loadAirports();
load();
setInterval(render, 60000);
</script>
