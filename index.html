<style>
  :root{
    --paper:#F2F6FA;
    --card:#FFFFFF;
    --ink:#1C2B3A;
    --ink-soft:#5E7185;
    --border:#DCE6F0;
    --teal:#3373A0;
    --teal-dark:#1F4E70;
    --gold:#B8892F;
    --sage:#4B7857;
    --slate:#8B96A5;
    --danger:#B1503F;
    --icon-bg:#E6EFF7;
    --status-upcoming-bg:#F3E7CB;
    --status-active-bg:#DCEADD;
    --status-done-bg:#E9EAEC;
    --danger-bg:#FBEEEC;
    --danger-border:#F0D5D0;
    --shadow:0 1px 3px rgba(28,43,58,0.06);
  }
  html[data-theme="dark"]{
    --paper:#111A22;
    --card:#182430;
    --ink:#E7EEF4;
    --ink-soft:#8FA3B8;
    --border:#28394C;
    --teal:#5FA3D0;
    --teal-dark:#8FC7EC;
    --gold:#D9B266;
    --sage:#7FBF93;
    --slate:#93A3B5;
    --danger:#E08573;
    --icon-bg:#1F3346;
    --status-upcoming-bg:#3A3320;
    --status-active-bg:#203A2A;
    --status-done-bg:#28323D;
    --danger-bg:#3A2622;
    --danger-border:#4A2E28;
    --shadow:0 1px 3px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  .app{ max-width:640px; margin:0 auto; padding:20px 16px 100px; }
  h1,h2,h3{ font-family:'Fraunces',serif; margin:0; }
  .top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .top h1{ font-size:26px; font-weight:600; letter-spacing:-0.01em; }
  .top .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .new-trip-btn{
    background:linear-gradient(135deg,var(--teal),var(--teal-dark)); color:#fff; border:none; border-radius:10px;
    padding:10px 14px; font-size:13.5px; font-weight:500; cursor:pointer;
    font-family:'Inter',sans-serif; white-space:nowrap;
  }
  .new-trip-btn:active{transform:scale(0.97);}
  .icon-btn{ background:var(--card); color:var(--teal-dark); border:1px solid var(--border); }
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty h3{font-size:19px;color:var(--ink);margin-bottom:8px;font-weight:600;}
  .empty p{font-size:14px;line-height:1.5;margin:0 0 18px;}
  .trip-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:16px; overflow:hidden; box-shadow:var(--shadow); }
  .trip-head{ padding:16px 18px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .trip-head-left{min-width:0;}
  .trip-name{font-size:18px;font-weight:600;}
  .trip-dest{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .trip-meta{font-size:11.5px;color:var(--ink-soft);margin-top:6px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.01em;}
  .chevron{flex-shrink:0;transition:transform 0.2s ease;color:var(--ink-soft);}
  .chevron.open{transform:rotate(180deg);}
  .bookings{border-top:1px solid var(--border);padding:14px 14px 16px;display:none;}
  .checklist-bar{
    display:flex; align-items:center; gap:10px; background:var(--icon-bg); border-radius:10px;
    padding:10px 12px; margin-bottom:12px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--teal-dark);
  }
  .checklist-progress{ flex:1; height:6px; background:var(--card); border-radius:4px; overflow:hidden; }
  .checklist-progress-fill{ height:100%; background:var(--teal); border-radius:4px; transition:width .2s ease; }
  .checklist-count{ font-size:11px; color:var(--ink-soft); font-weight:600; white-space:nowrap; }
  .archive-toggle{
    display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
    color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer;
    border-top:1px solid var(--border); margin-top:4px;
  }
  .bookings.open{display:block;}

  .card{
    background:var(--paper); border:1px solid var(--border); border-radius:10px;
    margin-bottom:10px; overflow:hidden;
  }
  .card-head{ display:flex; align-items:flex-start; gap:10px; padding:11px 12px; cursor:pointer; }
  .card-icon{ width:30px;height:30px;flex-shrink:0;border-radius:8px;background:var(--icon-bg);color:var(--teal); display:flex;align-items:center;justify-content:center; }
  .card-icon svg{width:16px;height:16px;}
  .card-main{ flex:1; min-width:0; }
  .card-title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-title{ font-size:14.5px; font-weight:600; line-height:1.3; }
  .status-pill{ font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; white-space:nowrap; letter-spacing:0.01em; flex-shrink:0; }
  .status-upcoming{background:var(--status-upcoming-bg);color:var(--gold);}
  .status-active{background:var(--status-active-bg);color:var(--sage);}
  .status-done{background:var(--status-done-bg);color:var(--slate);}
  .card-route{ font-size:12.5px; color:var(--ink); margin-top:3px; font-family:'IBM Plex Mono',monospace; }
  .card-time{ font-size:12px; color:var(--ink-soft); margin-top:3px; font-family:'IBM Plex Mono',monospace; }
  .card-duration{ display:inline-block; font-size:10.5px; color:var(--teal-dark); background:var(--icon-bg); padding:1px 6px; border-radius:6px; margin-left:6px; font-family:'Inter',sans-serif; }
  .card-code{ font-size:11px; color:var(--ink-soft); margin-top:3px; font-family:'IBM Plex Mono',monospace; }
  .card-chevron{ width:14px;height:14px;color:var(--ink-soft);flex-shrink:0;margin-top:3px;transition:transform .2s ease; }
  .card-chevron.open{transform:rotate(180deg);}

  .card-detail{ display:none; border-top:1px dashed var(--border); padding:10px 12px 12px 12px; }
  .card-detail.open{display:block;}
  .detail-row{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; line-height:1.4; }
  .detail-row b{color:var(--ink);font-weight:600;}
  .detail-row a{color:var(--teal);word-break:break-all;}
  .detail-actions{ display:flex; gap:8px; margin-top:8px; }
  .mini-btn{
    flex:1; padding:8px; border-radius:8px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif; border:1px solid var(--border);
    background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .mini-btn.danger{color:var(--danger);}
  .mini-btn svg{width:13px;height:13px;}

  .add-booking-btn{
    width:100%; background:none; border:1px dashed var(--border); border-radius:10px;
    padding:10px; color:var(--teal); font-size:13px; font-weight:500; cursor:pointer;
    margin-top:2px; font-family:'Inter',sans-serif;
  }
  .add-ticket-btn{
    width:100%; background:linear-gradient(135deg,var(--teal),var(--teal-dark)); border:none; border-radius:10px; padding:10px;
    color:#fff; font-size:13px; font-weight:600; cursor:pointer; margin-top:8px;
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .pro-badge{ font-size:9.5px; font-weight:700; background:rgba(255,255,255,0.25); padding:2px 6px; border-radius:6px; letter-spacing:0.03em; }
  .parse-hint{ font-size:11px; color:var(--ink-soft); text-align:center; margin-top:6px; line-height:1.4; }
  .del-trip{
    font-size:12.5px; font-weight:600; color:var(--danger); background:var(--danger-bg);
    border:1px solid var(--danger-border); border-radius:9px; cursor:pointer; padding:9px; width:100%;
    margin-top:10px; font-family:'Inter',sans-serif;
  }
  .del-trip:hover{opacity:0.85;}

  .overlay{ position:fixed;inset:0; background:rgba(10,15,20,0.55); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.open{display:flex;}
  .sheet{ background:var(--card); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:20px 18px 24px; max-height:88vh; overflow-y:auto; }
  .sheet h3{font-size:17px;font-weight:600;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:9px;
    font-size:14.5px; font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
  }
  .field textarea{resize:none;min-height:50px;}
  .type-row{display:flex;gap:6px;flex-wrap:wrap;}
  .type-opt{
    flex:1; min-width:70px; padding:9px 4px; border:1px solid var(--border); border-radius:9px;
    text-align:center; font-size:12px; cursor:pointer; color:var(--ink-soft);
  }
  .type-opt.sel{ border-color:var(--teal); background:var(--icon-bg); color:var(--teal-dark); font-weight:600; }
  .sheet-actions{display:flex;gap:10px;margin-top:16px;}
  .btn{ flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;}
  .btn-ghost{background:none;color:var(--ink-soft);border:1px solid var(--border);}

  .airport-wrap{position:relative;}
  .airport-results{
    position:absolute; left:0; right:0; top:100%; background:var(--card);
    border:1px solid var(--border); border-radius:9px; margin-top:4px; max-height:180px;
    overflow-y:auto; z-index:10; box-shadow:0 6px 18px rgba(0,0,0,0.18);
  }
  .airport-opt{ padding:8px 11px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border); }
  .airport-opt:last-child{border-bottom:none;}
  .airport-opt:hover{background:var(--paper);}
  .airport-opt .code{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--teal-dark);}
  .airport-opt .city{color:var(--ink-soft);font-size:11.5px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-weekdays{font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .cal-day{position:relative;padding:9px 0;border-radius:8px;font-size:13px;}
  .cal-day.has-booking{background:var(--icon-bg);color:var(--teal-dark);font-weight:600;cursor:pointer;}
  .cal-dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--teal);}
</style>
</head>
<body>
<div id="storageNote" style="display:none;max-width:640px;margin:10px auto 0;padding:8px 14px;font-size:12px;color:#8A6A2E;background:#F7EEDA;border-radius:8px;text-align:center;font-family:'Inter',sans-serif;">Изменения видны в этой сессии, но пока не сохраняются между визитами</div>
<div class="app" id="app"></div>

<div class="overlay" id="tripOverlay">
  <div class="sheet">
    <h3>Новая поездка</h3>
    <div class="field"><label>Название</label><input id="tripNameInput" placeholder="Например: Грузия, октябрь"></div>
    <div class="field"><label>Направление</label><input id="tripDestInput" placeholder="Тбилиси, Батуми"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeTripSheet()">Отмена</button>
      <button class="btn btn-primary" onclick="saveTrip()">Создать</button>
    </div>
  </div>
</div>

<div class="overlay" id="bookingOverlay">
  <div class="sheet" id="bookingSheetInner">
    <h3 id="bookingSheetTitle">Добавить бронирование</h3>
    <div class="field">
      <label>Тип</label>
      <div class="type-row" id="typeRow"></div>
    </div>
    <div class="field" id="subtypeField" style="display:none;">
      <label>Вид транспорта</label>
      <div class="type-row" id="subtypeRow"></div>
    </div>

    <div id="dynamicFields"></div>

    <div class="field history-wrap">
      <label>Источник или ссылка</label>
      <input id="bSourceLink" placeholder="Booking.com или прямая ссылка на бронь" autocomplete="off">
      <div class="airport-results" id="bSourceLinkHistResults"></div>
    </div>
    <div class="field"><label id="bStartLabel">Отправление</label><input id="bStart" type="datetime-local"></div>
    <div class="field"><label id="bEndLabel">Прибытие (если есть)</label><input id="bEnd" type="datetime-local"></div>
    <div class="field"><label>Номер брони / код</label><input id="bCode" placeholder="PNR, номер подтверждения"></div>
    <div class="field">
      <label>Стоимость (необязательно)</label>
      <div style="display:flex;gap:8px;">
        <input id="bPrice" type="number" step="0.01" placeholder="0" style="flex:2;">
        <select id="bCurrency" style="flex:1;">
          <option value="RUB">₽ RUB</option>
          <option value="USD">$ USD</option>
          <option value="EUR">€ EUR</option>
          <option value="BYN">Br BYN</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Заметка</label><textarea id="bNotes" placeholder="Что важно не забыть"></textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeBookingSheet()">Отмена</button>
      <button class="btn btn-primary" onclick="saveBooking()">Сохранить</button>
    </div>
  </div>
</div>

<div class="overlay" id="checklistOverlay">
  <div class="sheet" id="checklistSheet"></div>
</div>

<div class="overlay" id="calendarOverlay">
  <div class="sheet" id="calendarSheet"></div>
</div>

async function loadAirports(){
  let base = FALLBACK_AIRPORTS;
  try{
    const cached = localStorage.getItem('airports_cache_v1');
    if(cached){
      base = JSON.parse(cached);
    } else {
      const res = await fetch('https://raw.githubusercontent.com/mwgg/Airports/master/airports.json');
      const data = await res.json();
      const slim = Object.values(data)
        .filter(a => a.iata && a.iata.length === 3)
        .map(a => ({iata:a.iata, city:a.city||'', name:a.name||'', country:a.country||'', tz:a.tz||''}));
      if(slim.length){
        base = slim;
        try{ localStorage.setItem('airports_cache_v1', JSON.stringify(slim)); }catch(e){ /* quota — skip caching, still usable this session */ }
      }
    }
  }catch(e){ /* offline or blocked — keep curated ~100-airport fallback */ }
  let customs = [];
  try{ customs = JSON.parse(localStorage.getItem('custom_airports_v1')||'[]'); }catch(e){}
  AIRPORTS = base.concat(customs);
}

function searchAirports(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return [];
  let aliasIata = null;
  for(const key in RU_AIRPORT_ALIASES){
    if(key.startsWith(q) || q.startsWith(key)){ aliasIata = RU_AIRPORT_ALIASES[key]; break; }
  }
  const scored = [];
  for(const a of AIRPORTS){
    const iata = a.iata.toLowerCase();
    const city = (a.city||'').toLowerCase();
    const name = (a.name||'').toLowerCase();
    let score = -1;
    if(aliasIata && iata === aliasIata.toLowerCase()) score = 0;
    else if(iata === q) score = 1;
    else if(iata.startsWith(q)) score = 2;
    else if(city.startsWith(q)) score = 3;
    else if(city.includes(q)) score = 4;
    else if(name.startsWith(q)) score = 5;
    else if(name.includes(q)) score = 6;
    if(score >= 0) scored.push({a, score});
  }
  scored.sort((x,y)=> x.score - y.score || x.a.city.length - y.a.city.length);
  return scored.slice(0,8).map(x=>x.a);
}

async function loadRates(){
  try{
    const cached = JSON.parse(localStorage.getItem('rates_cache_v1')||'null');
    if(cached && (Date.now() - cached.ts) < 24*3600*1000){
      EXCHANGE_RATES = cached.rates;
      RATES_UPDATED_AT = cached.ts;
      if(loaded) render();
      return;
    }
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    if(data && data.rates && data.rates.EUR && data.rates.RUB){
      EXCHANGE_RATES = {USD:1, EUR:data.rates.EUR, RUB:data.rates.RUB, BYN:data.rates.BYN || EXCHANGE_RATES.BYN};
      RATES_UPDATED_AT = Date.now();
      try{ localStorage.setItem('rates_cache_v1', JSON.stringify({ts:RATES_UPDATED_AT, rates:EXCHANGE_RATES})); }catch(e){}
      if(loaded) render();
    }
  }catch(e){ /* offline — keep static fallback rates, so totals are approximate */ }
}
function fmtRateTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) + ' в ' + d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function tripTotalsByCurrency(trip){
  const totals = {};
  trip.bookings.forEach(b=>{
    if(b.price){ totals[b.currency] = (totals[b.currency]||0) + Number(b.price); }
  });
  return totals;
}
function tripCostSummary(trip){
  const totals = tripTotalsByCurrency(trip);
  const currencies = Object.keys(totals);
  if(!currencies.length) return '';
  let usdSum = 0;
  currencies.forEach(c=>{ usdSum += totals[c] / (EXCHANGE_RATES[c] || 1); });
  const fmt = n => n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
  const breakdown = currencies.length > 1 && !(currencies.length===1 && currencies[0]==='USD')
    ? ' (' + currencies.map(c=>`${Math.round(totals[c]).toLocaleString('ru-RU')} ${CURRENCY_SYMBOLS[c]||c}`).join(' + ') + ')'
    : '';
  const needsRate = currencies.some(c=>c!=='USD');
  const rateNote = (needsRate && RATES_UPDATED_AT) ? ` · курс на ${fmtRateTime(RATES_UPDATED_AT)}` : '';
  return `≈ $${fmt(usdSum)}${breakdown}${rateNote}`;
}

function fmtDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateTime(iso){
  if(!iso) return '';
  return fmtDateShort(iso) + ', ' + fmtTime(iso);
}

function bookingStatus(b){
  const now = new Date();
  const start = b.start ? new Date(b.start) : null;
  const end = b.end ? new Date(b.end) : start;
  if(!start) return {key:'upcoming', label:'Без даты'};
  if(now < start) return {key:'upcoming', label:'Предстоит'};
  if(end && now > end) return {key:'done', label:'Завершено'};
  return {key:'active', label:'Сейчас'};
}

function flightDuration(b){
  if(!(b.start && b.end && b.fromAirport && b.fromAirport.tz && b.toAirport && b.toAirport.tz)) return null;
  try{
    const DateTime = luxon.DateTime;
    const dep = DateTime.fromISO(b.start, {zone: b.fromAirport.tz});
    const arr = DateTime.fromISO(b.end, {zone: b.toAirport.tz});
    const mins = arr.diff(dep, 'minutes').minutes;
    if(!isFinite(mins) || mins < 0) return null;
    return `${Math.floor(mins/60)}ч ${Math.round(mins%60)}м`;
  }catch(e){ return null; }
}
function simpleDuration(b){
  if(!b.start || !b.end) return null;
  const ms = new Date(b.end) - new Date(b.start);
  if(ms <= 0) return null;
  const mins = Math.round(ms/60000);
  return `${Math.floor(mins/60)}ч ${mins%60}м`;
}
function nightsCount(b){
  if(!b.start || !b.end) return null;
  const d1 = new Date(b.start.slice(0,10));
  const d2 = new Date(b.end.slice(0,10));
  const diff = Math.round((d2-d1)/86400000);
  return diff > 0 ? diff : null;
}

function bookingIcon(b){
  if(b.type === 'transport') return ICONS[b.subtype] || ICONS.plane;
  return ICONS[b.type];
}
function bookingTitle(b){
  if(b.type === 'stay') return b.hotelName || 'Проживание';
  if(b.type === 'transport') return b.title || SUBTYPE_LABELS[b.subtype] || 'Транспорт';
  return b.title || TYPE_LABELS[b.type];
}
function bookingRoute(b){
  if(b.type === 'transport'){
    const from = b.fromAirport ? b.fromAirport.iata : (b.fromCity || '');
    const to = b.toAirport ? b.toAirport.iata : (b.toCity || '');
    if(from || to) return `${from || '—'} → ${to || '—'}`;
    return '';
  }
  if(b.type === 'stay') return b.hotelCity || '';
  return b.excCity || '';
}
function bookingDurationBadge(b){
  if(b.type === 'transport'){
    const d = b.subtype === 'plane' ? flightDuration(b) : simpleDuration(b);
    return d ? `<span class="card-duration">${d}</span>` : '';
  }
  if(b.type === 'stay'){
    const n = nightsCount(b);
    return n ? `<span class="card-duration">${n} ноч.</span>` : '';
  }
  return '';
}

function tripRange(trip){
  if(!trip.bookings.length) return 'Пока нет бронирований';
  const dates = trip.bookings.map(b=>b.start).filter(Boolean).map(d=>new Date(d));
  if(!dates.length) return trip.bookings.length + ' поз.';
  const min = new Date(Math.min(...dates));
  const max = new Date(Math.max(...dates));
  return fmtDateShort(min) + ' — ' + fmtDateShort(max) + ' · ' + trip.bookings.length + ' поз.';
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function tripLatestDate(trip){
  const dates = trip.bookings.map(b => new Date(b.end || b.start)).filter(d => !isNaN(d));
  if(!dates.length) return null;
  return new Date(Math.max(...dates.map(d=>d.getTime())));
}
function isTripArchived(trip){
  const latest = tripLatestDate(trip);
  return !!(latest && latest < new Date());
}

    </div>
    ${nextEventBanner()}
  `;

  if(trips.length === 0){
    html += `
      <div class="empty">
        <h3>Пока пусто</h3>
        <p>Создайте поездку и добавляйте в неё билеты, отели и экскурсии — с любых сайтов, где вы их покупали.</p>
        <button class="new-trip-btn" onclick="openTripSheet()">Создать первую поездку</button>
      </div>
    `;
  } else {
    const active = trips.filter(t=>!isTripArchived(t));
    const archived = trips.filter(t=>isTripArchived(t));
    const byDate = (a,b)=>{
      const da = a.bookings.map(x=>x.start).filter(Boolean).sort()[0] || '9999';
      const db = b.bookings.map(x=>x.start).filter(Boolean).sort()[0] || '9999';
      return da < db ? -1 : 1;
    };
    active.sort(byDate);
    archived.sort((a,b)=>byDate(b,a)); // most recently finished first

    active.forEach(trip=>{ html += renderTripCard(trip); });

    if(archived.length){
      html += `
        <div class="archive-toggle" onclick="toggleArchive()">
          <span>🗂 Архив (${archived.length})</span>
          <svg class="chevron ${archiveOpen?'open':''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      `;
      if(archiveOpen){
        archived.forEach(trip=>{ html += renderTripCard(trip); });
      }
    }
  }

  app.innerHTML = html;
}

function renderHistoryResults(inputId, key){
  const input = document.getElementById(inputId);

  box.style.display='block';

  if(!code) code = city.replace(/[^A-Za-zА-Яа-я]/g,'').slice(0,3).toUpperCase() || 'XXX';
  const tz = tzInput && tzInput.value ? tzInput.value : null;
  const airport = {iata: code, city, name: city, country:'', tz, custom:true};
  let customs = [];
  try{ customs = JSON.parse(localStorage.getItem('custom_airports_v1')||'[]'); }catch(e){}
  customs.push(airport);
  try{ localStorage.setItem('custom_airports_v1', JSON.stringify(customs)); }catch(e){}

  if(which==='from'){

async function saveBooking(){
  if(!editingTripFor) return;
  const trip = trips.find(t=>t.id===editingTripFor);
  if(!trip) return;

  const sourceVal = document.getElementById('bSourceLink').value.trim();
  const priceVal = document.getElementById('bPrice').value;
  const hotelNameVal = document.getElementById('bHotelName') ? document.getElementById('bHotelName').value.trim() : '';
  const titleVal = document.getElementById('bTitle') ? document.getElementById('bTitle').value.trim() : '';

  const data = {
    type: selectedType,
    subtype: selectedType === 'transport' ? selectedSubtype : undefined,
    title: titleVal,
    fromCity: document.getElementById('bFromCity') ? document.getElementById('bFromCity').value.trim() : '',
    toCity: document.getElementById('bToCity') ? document.getElementById('bToCity').value.trim() : '',
    fromAirport: (selectedType==='transport' && selectedSubtype==='plane') ? fromAirportObj : null,
    toAirport: (selectedType==='transport' && selectedSubtype==='plane') ? toAirportObj : null,
    hotelCity: document.getElementById('bHotelCity') ? document.getElementById('bHotelCity').value.trim() : '',
    hotelName: hotelNameVal,
    excCity: document.getElementById('bExcCity') ? document.getElementById('bExcCity').value.trim() : '',
    source: sourceVal,
    start: document.getElementById('bStart').value,
    end: document.getElementById('bEnd').value,
    code: document.getElementById('bCode').value.trim(),
    price: priceVal ? parseFloat(priceVal) : null,
    currency: document.getElementById('bCurrency').value || 'RUB',
    notes: document.getElementById('bNotes').value.trim()
  };

  saveHistoryValue('hist_source', sourceVal);
  if(hotelNameVal) saveHistoryValue('hist_hotel', hotelNameVal);

  if(editingBookingId){
    const idx = trip.bookings.findIndex(b=>b.id===editingBookingId);
    if(idx > -1) trip.bookings[idx] = {...trip.bookings[idx], ...data};
  } else {
    trip.bookings.push({id:'b'+Date.now(), ...data});
  }

  closeBookingSheet();
  render();
  await persist();
}

async function deleteBooking(tripId, bookingId){
  const trip = trips.find(t=>t.id===tripId);
  if(!trip) return;
  trip.bookings = trip.bookings.filter(b=>b.id!==bookingId);
  if(openBookingKey === tripId+':'+bookingId) openBookingKey = null;
  render();
  await persist();
}

function exportTripPDF(tripId){
  const trip = trips.find(t=>t.id===tripId);
  if(!trip) return;
  try{
    if(typeof jspdf === 'undefined' || typeof QRCode === 'undefined'){
      showAppNotice('Библиотеки для PDF не загрузились — проверьте интернет-соединение и попробуйте снова.');
      return;
    }
    // Keep the QR payload compact: drop free-text notes, keep the structural fields
    // needed to fully reconstruct the trip on import.
    const compact = {
      v: 1, name: trip.name, dest: trip.dest,
      bookings: trip.bookings.map(b=>({
        type:b.type, subtype:b.subtype, title:b.title,
        fromCity:b.fromCity, toCity:b.toCity, fromAirport:b.fromAirport, toAirport:b.toAirport,
        hotelCity:b.hotelCity, hotelName:b.hotelName, excCity:b.excCity,
        source:b.source, start:b.start, end:b.end, code:b.code, price:b.price, currency:b.currency
      }))
    };
    const payload = JSON.stringify(compact);

    // Positioned off-screen (NOT display:none) — some canvas/QR libraries measure
    // element dimensions to size their drawing, and display:none reports zero size.
    const qrHolder = document.createElement('div');
    qrHolder.style.position = 'absolute';
    qrHolder.style.left = '-9999px';
    qrHolder.style.top = '0';
    document.body.appendChild(qrHolder);
    new QRCode(qrHolder, {text: payload, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L});

    setTimeout(()=>{
      try{
        const qrImg = qrHolder.querySelector('canvas') || qrHolder.querySelector('img');
        if(!qrImg) throw new Error('QR-код не отрисовался');
        const qrData = qrImg.tagName === 'CANVAS' ? qrImg.toDataURL('image/png') : qrImg.src;

        const doc = new jspdf.jsPDF();
        doc.setFontSize(18);
        doc.text(trip.name || 'Поездка', 15, 20);
        if(trip.dest){ doc.setFontSize(11); doc.setTextColor(120); doc.text(trip.dest, 15, 27); doc.setTextColor(0); }
        let y = 38;
        doc.setFontSize(12);
        [...trip.bookings].sort((a,b)=>(a.start||'')<(b.start||'')?-1:1).forEach(b=>{
          const title = bookingTitle(b);
          const route = bookingRoute(b);
          const when = b.start ? fmtDateTime(b.start) + (b.end ? ' → ' + fmtDateTime(b.end) : '') : '';
          doc.setFont(undefined,'bold'); doc.text(title, 15, y); doc.setFont(undefined,'normal');
          y += 6;
          if(route){ doc.text(route, 15, y); y += 6; }
          if(when){ doc.text(when, 15, y); y += 6; }
      if(b.code){ doc.text('№ ' + b.code, 15, y); y += 6; }
          y += 4;
          if(y > 260){ doc.addPage(); y = 20; }
        });
        doc.addImage(qrData, 'PNG', 15, y + 5, 40, 40);
        doc.setFontSize(9); doc.setTextColor(140);
        doc.text('QR-код выше — служебный, для повторной загрузки этого маршрута в приложение "Маршрут".', 60, y + 25, {maxWidth:130});
        doc.save(`${trip.name || 'marshrut'}.pdf`);
      }catch(err){
        showAppNotice('Не получилось собрать PDF: ' + (err && err.message ? err.message : 'неизвестная ошибка') + '. Напишите мне точный текст ошибки, я поправлю.');
      }finally{
        document.body.removeChild(qrHolder);
      }
    }, 300);
  }catch(err){
    showAppNotice('Не получилось начать экспорт: ' + (err && err.message ? err.message : 'неизвестная ошибка'));
  }
}

// Parses the IATA "Bar Coded Boarding Pass" (BCBP) mandatory field layout.
// This is the standard almost all airlines use for the PDF417/QR code on a boarding pass.
// Note: BCBP does not encode the year — only day-of-year — so the year is inferred.
function parseBCBP(raw){
  try{
    if(!raw || raw[0] !== 'M' || raw.length < 60) return null;
    const name = raw.slice(2,22).trim().replace(/\s+/g,' ');
    const pnr = raw.slice(23,30).trim();
    const from = raw.slice(30,33).trim();
    const to = raw.slice(33,36).trim();
    const carrier = raw.slice(36,39).trim();
    const flightNum = raw.slice(39,44).trim().replace(/^0+/, '');
    const julianDay = parseInt(raw.slice(44,47), 10);
    if(!from || !to || isNaN(julianDay)) return null;
    const now = new Date();
    let year = now.getFullYear();
    let guess = new Date(year, 0, julianDay);
    // if that date is more than ~200 days in the past, it's more likely next year's flight
    if((now - guess) / 86400000 > 200) { year += 1; guess = new Date(year, 0, julianDay); }
    const iso = guess.toISOString().slice(0,10);
    return {name, pnr, from, to, carrier, flightNum, dateGuess: iso};
  }catch(e){ return null; }
}

async function decodeBarcodeFromCanvas(canvas){
  const codeReader = new ZXing.MultiFormatReader();
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.PDF_417, ZXing.BarcodeFormat.QR_CODE]);
  codeReader.setHints(hints);
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
  const luminanceSource = new ZXing.RGBLuminanceSource(imgDataToGrayscale(imgData), canvas.width, canvas.height);
  const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));
  return codeReader.decode(bitmap).getText();
}
function imgDataToGrayscale(imgData){
  const {data, width, height} = imgData;
  const gray = new Uint8ClampedArray(width*height);
  for(let i=0, j=0; i<data.length; i+=4, j++){
    gray[j] = (data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114) | 0;
  }
  return gray;
}
async function fileToCanvas(file){
  if(file.type === 'application/pdf'){
    const buf = await file.arrayBuffer();
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({scale: 2});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    return canvas;
  }
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img,0,0);
      resolve(canvas);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function handleTicketFile(e){
  const file = e.target.files[0];
  if(!file || !editingTripFor) return;
  const trip = trips.find(t=>t.id===editingTripFor);
  if(!trip) return;
  e.target.value = '';

  let parsed = null;
  try{
    const canvas = await fileToCanvas(file);
    const rawText = await decodeBarcodeFromCanvas(canvas);
    parsed = parseBCBP(rawText);
  }catch(err){ /* no barcode found or couldn't decode — fall back below */ }

  let booking;
  if(parsed){
    const fromAirport = AIRPORTS.find(a=>a.iata===parsed.from) || {iata:parsed.from, city:parsed.from, tz:null};
    const toAirport = AIRPORTS.find(a=>a.iata===parsed.to) || {iata:parsed.to, city:parsed.to, tz:null};
    booking = {
      id: 'b'+Date.now(), type:'transport', subtype:'plane',
      title: (parsed.carrier + ' ' + parsed.flightNum).trim(),
      fromAirport, toAirport, fromCity:'', toCity:'',
      source: 'Распознано со штрихкода посадочного', start: parsed.dateGuess + 'T00:00',
      end:'', code: parsed.pnr, price:null, currency:'RUB',
      notes: 'Год рейса определён приблизительно (в штрихкоде года нет) — проверьте дату и впишите точное время вылета.'
    };
  } else {
    booking = {
      id: 'b'+Date.now(), type:'transport', subtype:'plane',
      title: file.name.replace(/\.[^.]+$/, ''),
      source: 'Не удалось распознать штрихкод',
      fromAirport:null, toAirport:null, fromCity:'', toCity:'',
      start:'', end:'', code:'', price:null, currency:'RUB',
      notes: 'Штрихкод не найден или нечитаем в файле ' + file.name + ' — заполните вручную.'
    };
  }
  trip.bookings.push(booking);
  render();
  await persist();
  openBookingSheet(trip.id, booking.id);
}

function applyColorScheme(scheme){
  const manual = localStorage.getItem('theme_override');
  const dark = manual ? manual === 'dark' : scheme === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme_override', next);
  document.documentElement.setAttribute('data-theme', next);
  render();
}
function initTelegram(){
  try{
    const tg = window.Telegram && window.Telegram.WebApp;
    if(!tg){ applyColorScheme('light'); return; }
    tg.ready();
    tg.expand();
    applyColorScheme(tg.colorScheme);
    if(tg.onEvent) tg.onEvent('themeChanged', ()=>applyColorScheme(tg.colorScheme));
  }catch(e){ applyColorScheme('light'); }
}
const OWNER_TELEGRAM_USERNAMES = ['alinnenokkk']; // ваш @username в Telegram
function isProUser(){
  try{
    const u = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
    if(!u || !u.username) return false;
    return OWNER_TELEGRAM_USERNAMES.includes(u.username.toLowerCase());
  }catch(e){ return false; }
}
function nearestUpcoming(){
  const now = new Date();
  let best = null;
  trips.forEach(trip=>{
    trip.bookings.forEach(b=>{
      if(!b.start) return;
      const start = new Date(b.start);
      if(start > now && (!best || start < best.start)) best = {start, title: bookingTitle(b), tripName: trip.name};
    });
  });
  return best;
}
function countdownLabel(best){
  const diffMs = best.start - new Date();
  const days = Math.floor(diffMs/86400000);
  const hours = Math.floor((diffMs%86400000)/3600000);
  const mins = Math.floor((diffMs%3600000)/60000);
  if(days > 0) return `через ${days} дн ${hours} ч`;
  if(hours > 0) return `через ${hours} ч ${mins} мин`;
  return `через ${mins} мин`;
}
function nextEventBanner(){
  const b = nearestUpcoming();
  if(!b) return '';
  return `<div style="text-align:center;font-size:12px;color:var(--ink-soft);margin:-6px 0 14px;">⏳ <b style="color:var(--ink);">${esc(b.title)}</b> (${esc(b.tripName)}) — ${countdownLabel(b)}</div>`;
}

const DEFAULT_CHECKLIST_ITEMS = ['Паспорт','Загранпаспорт (если нужен)','Билеты и брони — скачаны офлайн','Страховка','Зарядка и переходник','Наличные и карты','Аптечка','Локальная SIM или роуминг'];
let checklistTripId = null;
function ensureChecklist(trip){
  if(!trip.checklist){
    trip.checklist = DEFAULT_CHECKLIST_ITEMS.map((text,i)=>({id:'c'+i+'_'+Date.now(), text, done:false}));
  }
  return trip.checklist;
}

function closeChecklist(){ document.getElementById('checklistOverlay').classList.remove('open'); render(); }
function renderChecklist(){

  if(!trip) return;
  const items = ensureChecklist(trip);
  document.getElementById('checklistSheet').innerHTML = `
    <h3>Чек-лист — ${esc(trip.name)}</h3>
    <div style="margin:14px 0;">
      ${items.map(it=>`
        <div style="display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);">
          <input type="checkbox" ${it.done?'checked':''} onchange="toggleChecklistItem('${it.id}')" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--teal);">
          <span style="flex:1;font-size:13.5px;${it.done?'text-decoration:line-through;color:var(--ink-soft);':''}">${esc(it.text)}</span>
          <span onclick="removeChecklistItem('${it.id}')" style="color:var(--ink-soft);cursor:pointer;padding:2px 5px;">✕</span>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;gap:8px;">
      <input id="checklistNewItem" placeholder="Добавить своё..." style="flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--paper);">
      <button class="mini-btn" style="flex:0 0 auto;padding:9px 16px;" onclick="addChecklistItem()">+</button>
    </div>
    <div class="sheet-actions"><button class="btn btn-primary" onclick="closeChecklist()">Готово</button></div>
  `;
}
function toggleChecklistItem(id){
  const trip = trips.find(t=>t.id===checklistTripId);
  const item = trip.checklist.find(i=>i.id===id);
  if(item){ item.done = !item.done; renderChecklist(); persist(); }
}
function removeChecklistItem(id){
  const trip = trips.find(t=>t.id===checklistTripId);
  trip.checklist = trip.checklist.filter(i=>i.id!==id);
  renderChecklist(); persist();
}
function addChecklistItem(){
  const input = document.getElementById('checklistNewItem');
  const text = input.value.trim();
  if(!text) return;
  const trip = trips.find(t=>t.id===checklistTripId);
  ensureChecklist(trip).push({id:'c'+Date.now(), text, done:false, custom:true});
  input.value = '';
  renderChecklist(); persist();
}

function allBookingDates(){
  const map = {};
  trips.forEach(trip=>{
    trip.bookings.forEach(b=>{
      if(!b.start) return;
      const label = bookingTitle(b);
      const d1 = new Date(b.start.slice(0,10));
      const d2 = b.end ? new Date(b.end.slice(0,10)) : d1;
      for(let d=new Date(d1); d<=d2; d.setDate(d.getDate()+1)){
        const key = d.toISOString().slice(0,10);
        if(!map[key]) map[key] = [];
        if(!map[key].some(x=>x.title===label && x.trip===trip.name)) map[key].push({trip: trip.name, title: label});
      }
    });
  });
  return map;
}
let calMonth = new Date();
function openCalendar(){ calMonth = new Date(); renderCalendar(); document.getElementById('calendarOverlay').classList.add('open'); }
function closeCalendar(){ document.getElementById('calendarOverlay').classList.remove('open'); }
function changeCalMonth(delta){ calMonth.setMonth(calMonth.getMonth()+delta); renderCalendar(); }
function renderCalendar(){
  const sheet = document.getElementById('calendarSheet');
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const first = new Date(year, month, 1);
  const startWeekday = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const map = allBookingDates();
  const monthName = calMonth.toLocaleDateString('ru-RU',{month:'long', year:'numeric'});
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = map[key];
    cells += `<div class="cal-day ${has?'has-booking':''}" ${has?`onclick="showCalDay('${key}')"`:''}>${d}${has?'<span class="cal-dot"></span>':''}</div>`;
  }
  sheet.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <button class="mini-btn" style="flex:0 0 auto;padding:8px 12px;" onclick="changeCalMonth(-1)">←</button>
      <h3 style="text-transform:capitalize;">${monthName}</h3>
      <button class="mini-btn" style="flex:0 0 auto;padding:8px 12px;" onclick="changeCalMonth(1)">→</button>
    </div>
    <div class="cal-grid cal-weekdays">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div id="calDayDetail" style="margin-top:14px;"></div>
    <div class="sheet-actions"><button class="btn btn-ghost" onclick="closeCalendar()">Закрыть</button></div>
  `;
}
function showCalDay(key){
  const items = allBookingDates()[key] || [];
  document.getElementById('calDayDetail').innerHTML = items.map(i=>
    `<div class="detail-row"><b>${esc(i.title)}</b> — ${esc(i.trip)}</div>`
  ).join('');
}
